<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kesar's Portfolio Pro</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap');

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    background:#f0f0f0;
    padding:30px;
}

/* Container - Glass Card */
.container{
    position: relative;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(10px);
    border-radius:20px;
    width:400px;
    min-height:600px;
    padding:60px 30px 30px 30px;
    box-shadow:0 8px 30px rgba(0,0,0,0.2);
    text-align:center;
    overflow:visible;
}

/* Profile Photo Top-Right with Glow */
.profile-pic{
    position: absolute;
    top:-50px;
    right:-50px;
    width:120px;
    height:120px;
    border-radius:50%;
    overflow:hidden;
    border:4px solid #a83232;
    box-shadow:0 0 15px rgba(255,204,0,0.8);
    transition:0.3s;
}

.profile-pic img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-pic:hover{
    transform: scale(1.1);
    box-shadow:0 0 25px rgba(255,204,0,1);
}

/* Heading */
.welcome{
    font-size:26px;
    font-weight:700;
    color:#a83232;
    margin-bottom:25px;
}

h2{
    margin-bottom:15px;
    color:#111;
}

/* Skills */
.skills{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:10px;
    margin-bottom:25px;
}

.skill{
    padding:10px 12px;
    border-radius:12px;
    background:#1DA1F2;
    color:#fff;
    font-weight:500;
    font-size:14px;
    transition:0.3s;
}

.skill:hover{
    transform:scale(1.05);
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* Social Links */
.links a{
    display:block;
    width:100%;
    text-decoration:none;
    margin:10px 0;
    padding:12px 0;
    border-radius:12px;
    font-weight:500;
    text-align:center;
    color:white;
    transition:0.3s;
}

.links a:nth-child(1){ background:#333; }           /* GitHub */
.links a:nth-child(2){ background:#1DA1F2; }        /* Twitter */
.links a:nth-child(3){ background:#0077B5; }        /* LinkedIn */
.links a:nth-child(4){ background:#f59e0b; }        /* Commudle */
.links a:nth-child(5){ background:linear-gradient(45deg,#833ab4,#fd1d1d,#fcb045); } /* Instagram */

.links a:hover{
    transform:scale(1.05);
    box-shadow:0 5px 15px rgba(0,0,0,0.2);
}

/* Responsive for small screens */
@media(max-width:450px){
    .container{
        width:90%;
        padding:60px 20px 20px 20px;
    }
    .profile-pic{
        width:100px;
        height:100px;
        top:-40px;
        right:-40px;
    }
}
</style>
</head>
<body>

<div class="container">

    <!-- Profile Photo -->
    <div class="profile-pic">
        <img src="profile.jpg" alt="Kesar Photo">
    </div>

    <!-- Welcome Section -->
    <div class="welcome">Welcome to My Space</div>

    <!-- Skills Section -->
    <h2>Skills</h2>
    <div class="skills">
        <div class="skill">Problem Solving</div>
        <div class="skill">Supervision & Leadership</div>
        <div class="skill">Time Management</div>
        <div class="skill">Project Management</div>
        <div class="skill">Communication</div>
        <div class="skill">Cooking</div>
        <div class="skill">Teamwork</div>
        <div class="skill">Analytical Thinking</div>
    </div>

    <!-- Social Links -->
    <div class="links">
        <a href="https://github.com/kesar-sooryavanshi" target="_blank">GitHub</a>
        <a href="https://x.com/kesar319889" target="_blank">Twitter</a>
        <a href="https://www.linkedin.com/in/kesar-sooryavanshi-480b39362" target="_blank">LinkedIn</a>
        <a href="https://www.commudle.com/users/9915487ff989ff52d72c0128b73c5b5c" target="_blank">Commudle</a>
        <a href="https://www.instagram.com/sooryavanshii_kesar" target="_blank">Instagram</a>
    </div>

</div>

</body>
</html>
